<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<!-- 版本 2026-10-04d（ES 出/回機；由 2026-10-01c 改寫；04b：橫向覆蓋層改由程式判斷；04c：相機影像改為純 CSS 填滿；04d：「除黑邊」按鈕，進入相機畫面時重建影像元素） -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2937">
<title>倉務掃描</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;background:#f3f4f6;color:#111;font-size:17px}
  :root{--hh:116px}
  header{position:sticky;top:0;z-index:5;background:#1f2937;color:#fff;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top))}
  /* 頂部列：返回＋標題（左）、重新載入資料（右） */
  .nav{display:flex;align-items:center;gap:8px;min-height:32px}
  .nav h1{flex:1;margin:0;font-size:19px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav button{padding:6px 12px;font-size:15px;flex:none}
  .who{display:flex;gap:8px;margin-top:5px}
  .who label{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:12px;color:#cbd5e1}
  input,select,textarea{font-size:17px;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#111}
  .who input{flex:1;min-width:0;font-size:16px;padding:5px 8px;border-radius:6px}
  /* 狀態文字固定兩行高度，避免頂部高度改變令相機畫面跳動 */
  #status{margin-top:4px;height:2.6em;font-size:13px;line-height:1.3;word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
  #status.s-err{color:#fca5a5;font-weight:bold}
  #status.s-ok{color:#86efac;font-weight:bold}
  #status.s-warn{color:#fde68a;font-weight:bold}
  button{font-size:17px;border:0;border-radius:10px;padding:12px 14px;background:#e5e7eb;color:#111;cursor:pointer}
  button:active{opacity:.7}
  button:disabled{opacity:.5}
  .small{padding:8px 10px;font-size:14px}
  .pri{background:#2563eb;color:#fff}
  .ok{background:#16a34a;color:#fff}
  .gray{background:#6b7280;color:#fff}
  main{padding:10px 12px 12px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .hidden{display:none!important}
  .home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .home button{height:32vw;max-height:170px;font-size:28px;font-weight:bold;color:#fff}
  .b-out{background:#2563eb!important}.b-in{background:#ea580c!important}.b-mat{background:#059669!important}.b-log{background:#4b5563!important}
  .b-prj{background:#7c3aed!important}.b-ack{background:#0f766e!important}
  .pm{display:flex;gap:4px;flex:none}
  .nav .pm button{padding:6px 10px}
  .nav .pm button.on{background:#2563eb;color:#fff}
  /* 相機畫面頂部同時有「返回」「除黑邊」「重新載入資料」（Project 另有出機／回機）：較窄的手機收細按鈕，令標題仍可完整顯示 */
  @media (max-width: 440px) {
    .nav{gap:5px}
    .nav button{padding:6px 7px;font-size:13px}
    .nav .pm{gap:3px}
    .nav .pm button{padding:6px 7px}
    .nav h1{font-size:17px}
  }
  @media (max-width: 380px) {
    .nav{gap:4px}
    .nav button{padding:6px 6px}
    .nav .pm{gap:2px}
    .nav .pm button{padding:6px 5px}
  }
  .loading{font-size:22px;font-weight:bold;text-align:center;padding:40px 10px;color:#374151;line-height:1.5}
  /* 桌面電腦沒有相機：收起相機畫面，只用條碼槍／手動輸入 */
  .cam.nocam{display:none}
  /* 倉務確認：讀取日數列及每部機的紀錄 */
  .ackbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ackbar label{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
  .ackbar input{width:6em;padding:6px 8px}
  table.cart .hist{display:block;font-size:12px;font-family:inherit;font-weight:normal;color:#374151}
  table.cart .hist.warn{color:#b91c1c;font-weight:bold}
  /* 相機畫面：盡用螢幕高度（扣除頂部、主區上邊距、S/N 輸入列及清單標題預留位置），最少 260 像素。
     以下為後備值；實際高度由程式按 window.innerHeight 計算（見「更新相機高度」），清單列數不影響相機高度 */
  .cam{position:relative;width:100%;height:calc(100vh - var(--hh) - 138px);height:calc(100svh - var(--hh) - 138px);min-height:260px;background:#000;border-radius:12px;overflow:hidden}
  /* 影像一律填滿相機畫面（cover，置中，裁去多出部分）：影像元素永遠與相機畫面同大，填滿方式完全由 CSS 負責，程式不設定影像元素的位置或大小。
     （04b 或以前由程式按影像尺寸設定像素位置及大小；iPhone 有時以過時的尺寸繪畫，令影像縮細並四邊出現黑邊，故已取消。）
     iPhone 於畫面再次顯示或影像尺寸改變後，由程式短暫改變影像元素（見「重繪影像」），迫使 Safari 按目前大小重新繪畫 */
  .cam video{position:absolute;left:0;top:0;right:0;bottom:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:50% 50%;display:block;background:#000;transform:none}
  .frame{position:absolute;left:10%;top:0;bottom:0;margin:auto 0;width:80%;height:25%;min-height:80px;max-height:140px;border:3px solid #22c55e;border-radius:8px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
  .camctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;align-items:center}
  .camctl input[type=range]{flex:1;padding:0}
  .camctl button{background:rgba(255,255,255,.85)}
  .row{display:flex;gap:8px;margin-top:10px}
  .row input{flex:1}
  .card{background:#fff;border-radius:12px;padding:12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .card label{display:block;font-size:14px;color:#374151;margin-top:8px}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns button{flex:1;padding:16px 8px}
  .tabs{display:flex;gap:8px}
  .tabs button{flex:1}
  .tabs button.on{background:#2563eb;color:#fff}
  .chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:16px}
  .chk input{width:24px;height:24px}
  .item{background:#fff;border-radius:10px;padding:10px;margin-top:8px;font-size:15px;line-height:1.5}
  .tag{display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;font-size:13px;margin-right:6px}
  .t-out{background:#2563eb}.t-in{background:#ea580c}.t-hk{background:#6b7280}.t-re{background:#7c3aed}.t-used{background:#16a34a}
  /* 記錄：每部機一張卡片，紀錄按時間由舊至新 */
  .hcard{border-top:1px solid #e5e7eb;padding:8px 0 4px}
  .hcard:first-child{border-top:0}
  .hcard .hsn{font-family:ui-monospace,Menlo,monospace;font-weight:bold;font-size:17px;word-break:break-all}
  .hcard .now{font-size:14px;font-weight:bold;margin:2px 0 4px}
  .ev{font-size:14px;line-height:1.45;padding:3px 0;border-top:1px dashed #e5e7eb}
  .ev .tag{min-width:4.6em;text-align:center}
  .ev .d{color:#374151;font-size:13px;display:block;padding-left:2px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-weight:bold}
  .muted{color:#6b7280;font-size:13px}
  /* 批次清單 */
  .frame.paused{border-color:#facc15}
  .pausebox{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;font-weight:bold;text-align:center;padding:16px;cursor:pointer}
  .pausebox .ico{width:64px;height:64px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;font-size:30px;padding-left:5px}
  .camctl{z-index:3}
  .flash{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(34,197,94,.45);opacity:0;pointer-events:none;transition:opacity .35s}
  .flash.on{opacity:1;transition:none}
  .frame.hit{border-color:#86efac;border-width:5px}
  .carthead{display:flex;align-items:center;gap:8px}
  .carthead b{flex:1;font-size:18px}
  .bulk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .bulk select{flex:1 1 60%;width:auto}
  .bulk input{flex:1 1 100%}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;border:1px solid #e5e7eb;border-radius:8px}
  table.cart{border-collapse:collapse;width:100%;font-size:15px}
  table.cart th{background:#f3f4f6;font-weight:600;font-size:13px;color:#374151;text-align:left;padding:6px;white-space:nowrap;position:sticky;top:0}
  table.cart td{border-top:1px solid #e5e7eb;padding:4px 6px;vertical-align:middle}
  table.cart td.n{color:#6b7280;text-align:right;width:1%;white-space:nowrap}
  table.cart td.csn{font-family:ui-monospace,Menlo,monospace;font-weight:bold;font-size:15px;word-break:break-all}
  table.cart input,table.cart select{font-size:16px;padding:6px;border-radius:6px}
  table.cart input[type=checkbox]{width:22px;height:22px;padding:0}
  table.cart td.cpps{width:7.5em}
  table.cart tr.sub td{border-top:0;padding-top:0}
  .subf{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
  .subf label{font-size:12px;color:#6b7280;display:block}
  .subf .wide{grid-column:1 / -1}
  table.cart .rsx{margin-top:4px}
  table.cart tr.new td{background:#dcfce7}
  table.cart tr.bad td{background:#fee2e2}
  table.cart input.need{border:2px solid #dc2626;background:#fef2f2}
  table.cart .nf{color:#b45309;font-size:12px;font-family:inherit;font-weight:normal;display:block}
  table.cart .inf{color:#6b7280;font-size:12px;font-family:inherit;font-weight:normal;display:block}
  .del{background:#fee2e2;color:#b91c1c;padding:6px 10px;font-size:16px}
  .empty{color:#6b7280;text-align:center;padding:14px;font-size:15px}
  #writeAll{width:100%;margin-top:10px;padding:16px 8px;font-size:19px;font-weight:bold}
  /* 只限直向：橫向時以覆蓋層遮蓋整個畫面（相機串流仍在底下運作）。
     z-index 用最大值，蓋過所有固定層（包括 Netlify 於網頁加入的標誌框，z-index 2147483645）；
     外圍陰影向四邊延伸，iPhone 轉向或網址列伸縮期間亦不會露出底下畫面（陰影不影響版面及捲動範圍）。
     是否橫向由程式判斷並設定 html 的 rot-on／rot-off（見「更新直向提示」）；媒體查詢只作程式執行前的後備 */
  #rotate{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:2147483647;background:#111827;box-shadow:0 0 0 200px #111827;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:24px;font-weight:bold;text-align:center;padding:20px;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #rotate .ico{font-size:56px;transform:rotate(90deg)}
  @media (orientation: landscape) and (max-height: 600px) { #rotate{display:flex} }
  html.rot-on #rotate{display:flex!important}
  html.rot-off #rotate{display:none!important}
</style>
</head>
<body>
<div id="rotate" role="alert"><div class="ico">📱</div>請將手機轉回直向使用</div>
<header>
  <div class="nav">
    <button id="navBack" class="gray hidden" data-back>返回</button>
    <span id="pmode" class="pm hidden"><button data-pm="pout" class="on">出機</button><button data-pm="pin">回機</button></span>
    <h1 id="navTitle">倉務掃描</h1>
    <button id="fixCam" class="hidden">除黑邊</button>
    <button id="reload">重新載入資料</button>
  </div>
  <div class="who">
    <label>LEADER<input id="leader" autocomplete="off"></label>
    <label>CPE<input id="cpe" autocomplete="off"></label>
  </div>
  <div id="status">正在載入資料…</div>
</header>

<main>
  <!-- 主頁 -->
  <section id="v-home" class="home">
    <button class="b-out" data-go="out">出機</button>
    <button class="b-in" data-go="in">回機</button>
    <button class="b-mat" data-go="mat">出料</button>
    <button class="b-log" data-go="log">記錄</button>
    <button class="b-prj" data-go="prj">Project</button>
    <button class="b-ack hidden" id="goAck" data-go="ack">倉務確認</button>
  </section>

  <!-- 出機／回機／倉務確認／Project -->
  <section id="v-scan" class="hidden">
    <div id="ackBar" class="ackbar hidden">
      <label>讀取日數<input id="ackDays" type="number" inputmode="numeric" min="1" max="3650" step="1" autocomplete="off"></label>
      <button id="ackLoad" class="small pri">讀取</button>
    </div>
    <div class="cam" id="camBox">
      <video id="video" playsinline muted></video>
      <div id="flash" class="flash"></div>
      <div id="frame" class="frame"></div>
      <div id="pausebox" class="pausebox hidden" role="button"><div class="ico">▶</div>已暫停讀取，按此繼續掃描</div>
      <div class="camctl">
        <button id="torch" class="small hidden">燈</button>
        <input id="zoom" type="range" class="hidden">
      </div>
    </div>
    <div class="row">
      <input id="manual" placeholder="輸入機身編號（可用條碼槍）" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button id="lookup" class="pri">加入</button>
    </div>
    <div id="cart" class="card">
      <div class="carthead"><b id="cartTitle">清單（0 部）</b><button id="clearAll" class="small gray">清除全部</button></div>
      <div id="bulk" class="bulk hidden">
        <select id="bulkReason"></select>
        <button id="bulkApply" class="small pri">套用原因到已選</button>
        <input id="bulkOther" class="hidden" placeholder="請輸入原因" maxlength="100" autocomplete="off">
      </div>
      <div class="tblwrap">
        <table class="cart">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <button id="writeAll" class="ok" disabled>全部寫入（0 部）</button>
    </div>
    <div id="logBox" class="card hidden">
      <div class="carthead" id="logHead"><b id="logTitle">已掃描（0 部）</b><button id="logClear" class="small gray">清除</button></div>
      <div id="logList"></div>
    </div>
  </section>

  <!-- 出料 -->
  <section id="v-mat" class="hidden">
    <div class="card">
      <label>Fiber（米）<input id="fiber" type="number" inputmode="decimal" min="0" step="any" autocomplete="off"></label>
      <label>SC頭（個）<input id="sc" type="number" inputmode="numeric" min="0" step="1" autocomplete="off"></label>
      <label>Patch cord<input id="patch" type="number" inputmode="numeric" min="0" step="1" autocomplete="off"></label>
      <label>Gpon socket<input id="gpon" type="number" inputmode="numeric" min="0" step="1" autocomplete="off"></label>
      <label>Cat5<input id="cat5" type="number" inputmode="decimal" min="0" step="any" autocomplete="off"></label>
      <div class="btns"><button id="matSend" class="ok">送出</button></div>
    </div>
  </section>

</main>

<script>
/* ======================================================================
 * ★ 網頁應用程式網址（Web App URL）★
 * 部署「掃描.gs」（獨立專案）為網頁應用程式後，把網址（https://script.google.com/macros/s/…/exec）貼在下面引號內。
 * ====================================================================== */
var 掃描網址 = 'https://script.google.com/macros/s/AKfycbzFYztQq9AowfGRqr1PZRvjQVW7j-IOmq10TGwkD97bowY7L9337CKuJBeow8D5d-aGhg/exec';

// 回機原因選項（按此次序顯示；寫入試算表的文字與此完全相同）。最後一項為自行輸入。
var 回機原因 = [
  '收機Order',
  'Relocate / 升級 收機',
  '維修換機',
  '倉出多左冇用',
  '已用Spare機安裝',
  '改期 / 取消安裝',
  '未用Spare機',
  '壞機 - Out Sync',
  '壞機 - 冇電唔著',
  '壞機 - 鍵盤 / 屏幕問題',
  '壞機 - 其他(請在Remark輸入原因)',
  'Config問題',
  '其他（自行輸入）'
];
// 選擇以下原因時，該部機的備註必須填寫
var 須填備註原因 = ['壞機 - 其他(請在Remark輸入原因)'];
var 自行輸入 = '其他（自行輸入）';
var 網址上限 = 1900;         // 每個 JSONP 請求網址的長度上限（字元）；超出則分段送出
var 每段上限 = 30;           // 每段最多部數

var 格式 = ['code_128', 'code_39', 'qr_code'];
var ZXING網址 = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
// zxing-cpp WebAssembly（無原生 BarcodeDetector 時的主要解碼器，例如 iPhone）
var WASM腳本網址 = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js';
var WASM檔網址 = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/reader/zxing_reader.wasm';
var WASM格式 = ['Code128', 'Code39', 'QRCode'];
var 最短截寬 = 1000;         // 截框寬度不足 1000 像素時放大
var 最高解像度 = [3840, 2160];
// 每次開啟相機（包括返回本頁後重新開啟）及每次 applyConstraints（燈、縮放）都使用同一組解像度要求，
// 避免串流途中改變解像度／比例（iPhone 於串流中途轉換解像度時，影像比例會改變）
function 相機解像度() { return { width: { ideal: 最高解像度[0] }, height: { ideal: 最高解像度[1] } }; }
var 解碼間隔 = 200;          // 每秒最多約 5 次（由開始計）
var 最短間隙 = 60;           // 每次解碼之間最少讓出主執行緒 60 毫秒
// 自動調節效能（較舊／較慢的手機）：平均解碼時間超過 150 毫秒即降一級，低於 60 毫秒回升一級
// 每級：截框寬度上限、解碼間隔、每幾次才試加強版影像、每幾次失敗才以 ZXing JS 補試
var 效能級別 = [
  { 截寬: Infinity, 間隔: 200, 加強每: 1, 後備每: 3 },
  { 截寬: 1200, 間隔: 300, 加強每: 3, 後備每: 6 },
  { 截寬: 1000, 間隔: 450, 加強每: 4, 後備每: 9 }
];
var 慢門檻 = 150, 快門檻 = 60;
var 背景解碼逾時 = 4000;      // Web Worker 單次解碼逾時（毫秒），逾時即改回主執行緒
var 重讀間隔 = 3000;         // 同一條碼 3 秒內不重讀
var 最少字數 = 6;            // 少於 6 個字視為誤讀
var 確認次數 = 2;            // 同一條碼須於 2 秒內讀到 2 次

var 狀態 = { 畫面: 'home', 模式: 'out', 資料: null, 出機索引: {}, 回機索引: {}, macMap: {},
  串流: null, 計時: 0, 忙: false, 上次碼: '', 上次時間: 0, 候選: '', 候選次: 0, 候選時間: 0, 偵測器: null, 讀取器: null, wasm: false, 準備中: null, 失敗次: 0,
  解像度約束: 相機解像度(), 進階約束: {}, 影像版面: '', 截框資料: null,

/* ---------- 批次寫入 ---------- */

/** 把清單轉為分段：出機 [S/N, PPS]；回機 [S/N, PPS, ORDER TYPE 字典序, REASON 字典序, 備註]（每段附字串字典 d，縮短網址） */
function 分段(kind, rows) {
  var chunks = [], cur = null;
  var 新段 = function () { cur = { items: [], d: [] }; chunks.push(cur); };
  var 回 = !!模式表[kind].原因;
  var 參數 = function (ck) { var p = { action: 模式表[kind].動作, bid: 'x'.repeat(14), n: 99, of: 99, items: JSON.stringify(ck.items), leader: $('leader').value, cpe: $('cpe').value }; if (回) p.d = JSON.stringify(ck.d); return p; };
  rows.forEach(function (r) {
    if (!cur) 新段();
    var 試 = function (ck) {
      var t = { items: ck.items.slice(), d: ck.d.slice() };
      var 字 = function (v) { v = String(v || '').trim(); var i = t.d.indexOf(v); if (i < 0) { t.d.push(v); i = t.d.length - 1; } return i; };
      var pps = String(r.pps || '').trim();
      var 碼 = 顯示碼(r);   // 寫入試算表的 S/N（保留「-」）
      t.items.push(回 ? [碼, pps, 字(''), 字(列原因(r)), String(r.rm || '').trim()] : [碼, pps]);
      return t;
    };
    var t = 試(cur);
    if (cur.items.length && (cur.items.length >= 每段上限 || 網址長(參數(t)) > 網址上限)) { 新段(); t = 試(cur); }

  嘗試(0).then(function (r) {
    var 集 = {}; pend.sns.forEach(function (s) { 集[s] = 1; });
    var 清 = 當前();

/** 捲到項目編號最小的問題列：欠原因 → 選單只捲動（自行輸入則聚焦原因輸入框）；欠備註 → 聚焦備註 */

$('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); 手動加入(); } });
$('clearAll').addEventListener('click', 清除全部);
$('writeAll').addEventListener('click', function () { 準備聲音(); 全部寫入(); });
$('tbody').addEventListener('input', 表格輸入);
$('tbody').addEventListener('change', 表格輸入);
$('tbody').addEventListener('click', function (e) {
  var b = e.target.closest('[data-del]'); if (!b) return;
  刪除列(b.closest('tr').getAttribute('data-sn'));
});
$('thead').addEventListener('change', function (e) {
  if (e.target.id !== 'chkAll') return;
  var on = e.target.checked;
  狀態.清單.rows.forEach(function (r) { r.chk = on; });
  document.querySelectorAll('#tbody [data-f=chk]').forEach(function (x) { x.checked = on; });
  稍後存清單();
});
$('bulkReason').innerHTML = 原因選項('');
$('bulkReason').addEventListener('change', function () { $('bulkOther').classList.toggle('hidden', this.value !== 自行輸入); });
$('bulkApply').addEventListener('click', 套用原因);
function 讀取日數() { if (狀態.模式 === 'log') 載入記錄(); else 載入倉資料(); }
$('ackLoad').addEventListener('click', 讀取日數);
$('ackDays').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); 讀取日數(); } });
$('logClear').addEventListener('click', function () { 狀態.記錄.顯示 = []; 繪記錄(); 顯示('已清除'); });
$('torch').addEventListener('click', function () {
  var t = 相機軌(); if (!t) return;
  var on = !狀態.燈;
  套用約束(t, { torch: on }).then(function () {
    狀態.燈 = on; $('torch').textContent = on ? '燈（開）' : '燈';
    安排重排影像();   // 相機重新設定後 iPhone 可能改變影像圖層：重新繪畫
  }).catch(function () { 顯示('無法開啟燈', 'err'); });
});
$('zoom').addEventListener('input', function () {
  var t = 相機軌(); if (t) 套用約束(t, { zoom: Number($('zoom').value) }).then(安排重排影像, function () {});
});
綁定影像事件($('video'));
if (window.ResizeObserver) new ResizeObserver(function () { 版面影像(); }).observe($('camBox'));
$('matSend').addEventListener('click', 送出料);
$('fixCam').addEventListener('click', 除黑邊);
/* 使用者操作相機以外的任何地方（清單、輸入框、選單、按鈕）即暫停讀取，避免解碼拖慢操作；按相機畫面繼續 */
function 操作(e) {
  if (狀態.畫面 !== 'scan' || 狀態.暫停讀取 || 狀態.自動聚焦) return;
  var t = e.target;
  if (t && t.closest && (t.closest('#camBox') || t.closest('#fixCam'))) return;   // 相機畫面及「除黑邊」屬相機控制，不暫停
  暫停讀取();
}
document.addEventListener('pointerdown', 操作, true);
document.addEventListener('touchstart', 操作, { capture: true, passive: true });
document.addEventListener('focusin', 操作, true);
/* 相機畫面未能自動播放時，於使用者下次按畫面（屬使用者操作）時再次播放 */
function 重試播放() { if (狀態.播放受阻 && 狀態.畫面 === 'scan') 播放影像(); }
document.addEventListener('click', 重試播放, true);
document.addEventListener('touchend', 重試播放, { capture: true, passive: true });
$('camBox').addEventListener('click', function (e) {
  if (e.target.closest('.camctl') || !狀態.暫停讀取) return;
  準備聲音();
  繼續讀取();
});
window.addEventListener('pagehide', function () { 立即存清單(); if (狀態.畫面 === 'scan') 停止相機(); });
/* 程式轉到背景：完全停止相機；返回前景：以同一途徑重新開啟（系統於背景時多已中斷相機，舊串流不可再用） */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) 立即存清單();
  if (狀態.畫面 !== 'scan') return;
  if (document.hidden) 停止相機();
  else { 狀態.自動重開 = 0; 重建影像(); 開始相機(); }
});
window.addEventListener('pageshow', function (e) {
  if (e.persisted && 狀態.畫面 === 'scan' && !document.hidden && !狀態.串流 && !狀態.啟動中) { 狀態.自動重開 = 0; 開始相機(); }
});

/* ---------- 版面：以頂部實際高度計算相機畫面高度 ---------- */
function 更新版面() {
  var h = document.querySelector('header').offsetHeight;
  if (h && 更新版面.h !== h) { 更新版面.h = h; document.documentElement.style.setProperty('--hh', h + 'px'); }
  更新相機高度();
}
/** 相機畫面高度＝視窗實際高度（window.innerHeight）－相機畫面以上的高度（頂部＋主區上邊距）－相機畫面底至「清單（N 部）」標題列底的距離。
 *  即捲回頂部時，相機下方只露出 S/N 輸入列及清單標題列；清單內容（列數、原因選單）不影響相機高度。最少 260 像素。 */
var 相機最矮 = 260;
function 更新相機高度() {
  var cam = $('camBox'), head = 狀態.模式 === 'log' ? $('logHead') : document.querySelector('#cart .carthead');
  if (狀態.畫面 !== 'scan' || !cam.offsetHeight || !head) return;
  var vh = window.innerHeight;
  if (!vh) return;
  // 輸入時（部分 Android 瀏覽器彈出鍵盤會縮小視窗）不縮小相機畫面，避免畫面跳動
  var a = document.activeElement;
  if (更新相機高度.vh && vh < 更新相機高度.vh && a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox') return;
  更新相機高度.vh = vh;
  var cr = cam.getBoundingClientRect(), 頂 = cr.top + (window.pageYOffset || document.documentElement.scrollTop || 0);
  var 下方 = head.getBoundingClientRect().bottom - cr.bottom + 4;   // 相機底至清單標題列底（另留 4 像素）
  var h = Math.max(相機最矮, Math.floor(vh - 頂 - 下方));
  if (Math.abs(h - cr.height) >= 1) cam.style.height = h + 'px';
}
更新版面();
window.addEventListener('resize', function () { 更新版面(); 版面影像(); });
window.addEventListener('orientationchange', function () { 更新版面(); setTimeout(function () { 更新版面(); 版面影像(); }, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { 更新版面(); 版面影像(); });
if (window.ResizeObserver) new ResizeObserver(更新版面).observe(document.querySelector('header'));

/* ---------- 只限直向 ---------- */
function 鎖直向() {
  try {
    var o = screen.orientation;
    if (o && o.lock) { var r = o.lock('portrait'); if (r && r.catch) r.catch(function () {}); }   // 一般瀏覽器分頁不能鎖定，改以覆蓋層提示
  } catch (e) {}
}
鎖直向();
document.addEventListener('click', function 首次() { 鎖直向(); document.removeEventListener('click', 首次); });
/* iPhone（Safari、主畫面網頁程式、App 內瀏覽器）不能鎖定網頁方向：橫向時顯示覆蓋層（相機繼續在底下運作）。
 * 不單靠 CSS 媒體查詢：由程式判斷並設定 html 的 rot-on／rot-off。
 * 以視窗闊度是否明顯大於螢幕短邊判斷橫向，Android 彈出鍵盤令視窗變矮時不會被誤當作橫向；
 * 平板電腦及桌面電腦（螢幕短邊大於 600 像素）不顯示。 */
function 是橫向() {
  var de = document.documentElement, w = de.clientWidth || window.innerWidth || 0, h = de.clientHeight || window.innerHeight || 0;
  if (!w || !h || w <= h) return false;
  var sw = screen.width || 0, sh = screen.height || 0, 短邊 = Math.min(sw, sh) || Math.min(w, h);
  if (短邊 > 600) return false;
  if (w > 短邊 * 1.15) return true;
  var o = screen.orientation && screen.orientation.type;
  if (o) return o.indexOf('landscape') === 0;
  if (typeof window.orientation === 'number') return Math.abs(window.orientation) === 90;
  return false;
}
function 更新直向提示() {
  var on = 是橫向(), de = document.documentElement;
  if (更新直向提示.on === on && de.classList.contains(on ? 'rot-on' : 'rot-off')) return;
  更新直向提示.on = on;
  de.classList.toggle('rot-on', on); de.classList.toggle('rot-off', !on);
  if (!on && 狀態.畫面 === 'scan') 安排重排影像();   // 轉回直向：相機畫面大小已改變，重新計算填滿版面
}
/** 轉向時部分手機稍後才更新視窗尺寸：即時檢查一次，0.15 秒及 0.5 秒後再檢查 */
function 直向檢查() {
  更新直向提示();
  clearTimeout(直向檢查.t1); clearTimeout(直向檢查.t2);
  直向檢查.t1 = setTimeout(更新直向提示, 150); 直向檢查.t2 = setTimeout(更新直向提示, 500);
}
更新直向提示();
['resize', 'orientationchange', 'pageshow', 'focus'].forEach(function (ev) { window.addEventListener(ev, 直向檢查); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', 直向檢查);
try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', 直向檢查); } catch (e) {}
try {
  var 橫向查詢 = window.matchMedia && matchMedia('(orientation: landscape)');
  if (橫向查詢) { if (橫向查詢.addEventListener) 橫向查詢.addEventListener('change', 直向檢查); else if (橫向查詢.addListener) 橫向查詢.addListener(直向檢查); }
} catch (e) {}
document.addEventListener('visibilitychange', function () { if (!document.hidden) 直向檢查(); });
setInterval(function () { if (!document.hidden) 更新直向提示(); }, 1000);   // 後備：個別瀏覽器轉向時未必發出任何事件

/* ---------- 啟動 ---------- */
try { var 舊 = localStorage.getItem(預載鍵); if (舊) 建索引(JSON.parse(舊)); } catch (e) {}
預載();
</script>
</body>
